hoa bởi Bác sĩ chuyên khoa tim mạch, và phải có dấu chứng trên chụp động mạch vành cản quang.\n- Điều trị ung thư biểu mô tại chỗ (Carcinoma in situ) (hỗ trợ tối đa 1 lần/ THHĐ)\n   · Phạm vi chi trả bao gồm: Ung thư cổ tử cung (với mức độ bệnh từ Ung thư biểu mô loại III trở lên); Ung thư tử cung; Ung thư vú; Ung thư buồng trứng; Ung thư ống dẫn trứng; Ung thư âm đạo; Ung thư tinh hoàn.\n  · Ung thư biểu mô tại chỗ là sự tăng truởng độc lập, tại chỗ của các tế bào ung thư biểu mô chưa gây xâm lấn các mô lành. “Xâm lấn” nghĩa là sự thâm nhiễm xuyên qua lớp màng nền biểu mô. \n  · Ung thư biểu mô tại chỗ phải luôn được chẩn đoán xác định dựa trên cơ sở chẩn đoán mô học, quan sát dưới kính hiển vi mẫu mô sinh thiết; và trong trường hợp ung thư cổ tử cung, chẩn đoán xác định bệnh phải là kết quả giải phẫu bệnh lý của mẫu mô sinh thiết khi khoét chóp cổ tử cung hay khi nội soi cổ tử cung. Chẩn đoán chỉ dựa trên khám lâm sàng không có kết quả giải phẫu bệnh lý của mẫu sinh thiết sẽ không thỏa tiêu chuẩn để nhận quyền lợi này.","Sau khi BHN lần 1 được chi trả","100% STBH + BTTL + LCCHĐ (nếu có)"],["Quyền lợi giảm phí cho HĐ có STBH lớn\n(Phí BH quy năm - STBH x hệ số giảm)"],["STBH của SPC","Hệ số giảm \n(tính trên STBH)"],["100triệu ≤ STBH < 150triệu","0,4 %"],["150triệu ≤ STBH < 200triệu","0,6 %"],["≥ 200 triệu","0,8 %"],["Danh sách 37 bệnh hiểm nghèo","Nhóm 1","Nhóm 2","Nhóm 3","Nhóm 4","Nhóm 5"],["01. Ung thư đe dọa tính mạng\n02. Bệnh cơ tim\n03. Phẫu thuật bắc cầu động mạch vành\n04. Bệnh nhồi máu cơ tim\n05. Phẫu thuật van tim\n06. Tăng áp lực động mạch phổi nguyên phát\n07. Phẫu thuật động mạch chủ\n08. Bệnh thiếu máu bất sản","09. Bệnh gan giai đoạn cuối\n10. Bệnh phổi giai đoạn cuối\n11. Bệnh thận giai đoạn cuối\n12. Cắt cụt các chi\n13. Bỏng nặng\n14. Ghép cơ quan chính\n15. Viêm thận do bệnh Lupus ban đỏ hệ thống","16. Viêm màng não nhiễm khuẩn (viêm màng não mủ)\n17. U não lành tính\n18. Phẫu thuật sọ não do bệnh của não bộ\n19. Hôn mê\n20. Viêm não\n21. Chấn n có thời hạn từ 6  tháng trở xuống (Tín phiếu kho bạc...) (tối đa 40%)"],["Thưởng trên GTTK cơ bản","Thưởng trên GTTK đầu tư thêm"],["3.5% giá trị bình quân của GTTK cơ bản trong 60 tháng gần nhất\nBắt đầu từ cuối năm thứ 5 và cứ 5 năm 1 lần với điều kiện:\n- HĐ đang IF\n- Phí BH cơ bản đóng đầy đủ tại thời điểm xét thưởng\n- Không rút tiền từ GTTK cơ bản trong 5 năm liền kề\n(Tự động phân bổ vào GTTK cơ bản của HĐ)","3.5% giá trị bình quân của GTTK đầu tư thêm trong 60 tháng gần nhất\nBắt đầu từ cuối năm thứ 5 và cứ 5 năm 1 lần với điều kiện:\n- HĐ đang IF\n- Không rút tiền từ GTTK tích lũy trong 5 năm liền kề\n(Tự động phân bổ vào GTTK tích lũy của HĐ)","Tỷ lệ đầu tư vào các quỹ phải là bội số của 5 và tổng tỷ lệ đầu tư phải là 100%"],["III. CÁC NGHIỆP VỤ PHÁT SINH"],["1. Đầu tư thêm (Topup) - bắt buộc phải có PYC"],["Topup khi nộp hồ sơ hoặc trong 21 ngày cân nhắc sẽ được định giá ngay sau khi kết thúc thời gian cân nhắc - phải có PYC"],["QUÀ TẶNG THAM GIA HỢP ĐỒNG GIÁ TRỊ LỚN","QUYỀN LỢI ĐÁO HẠN","Anytime nhưng chỉ được phân bổ với điều kiện phí BH cơ bản đến hết năm HĐ hiện tại đã được đóng đầy đủ và theo tỷ lệ đầu tư mà KH lựa chọn trên PYC (Trong thời gian tạm ngưng ko được Topup)"],["Quà tặng sẽ được cộng vào GTTK cơ bản vào ngày định giá ngay sau thời hạn cân nhắc theo mức sau:","100% GTQ của HĐ\n(Định giá ngay sau ngày đáo hạn HĐ)"],["Phí BH cơ bản quy năm của năm HĐ đầu tiên","% Phí BH cơ bản năm HĐ đầu tiên thực đóng","Không giới hạn số lần nhưng Max 10 lần phí BH cơ bản năm đầu tiên trong 1 năm\nMin 2 triệu/ lần"],["Từ 50 triệu đến < 100 triệu","0.03","Đối tượng yêu cầu là BMBH hoặc NĐBH (trong trường hợp BMBH là tổ chức)"],["≥ 100 triệu","0.05","2. Thay đổi tỷ lệ đầu tư\nThay đổi về tỷ lệ Phí BH được phân bổ vào các Quỹ đầu tư"],["Anytime\nĐối tượng yêu cầu là BMBH hoặc NĐBH (trong trường hợp BMBH là tổ chức)"],["DANH MỤC CÁC SẢN PHẨM GIA TĂNG BẢO VỆ","Tỷ lệ đầu tư phải là bội số của 5 và tổng tỷ lệ đầu tư phải là 100%\nÁp dụng cho tất cả phí BH cơ bản được nộp kể từ sau khi y/c được cty chấp thuận"],["Sản phẩm GTBV Nhóm 1\n•BH tử vong (mới) - chỉ tham gia cho LA1\n•BH chết do tai nạn\n•BH Chết và tàn tật do tai nạn mở rộng\n•BH Chăm sóc sức khỏe\n•BH bệnh lý nghiêm trọng(*)\n•BH từ bỏ thu phí bệnh lý nghiêm trọng(**)","Sản phẩm GTBV Nhóm 2:\n•BH nhân thọ có kỳ hạn - chỉ áp dụng cho NĐBH bổ sung\n•BH nhân thọ có kỳ hạn (dành cho trẻ em) - chỉ áp dụng cho NĐBH bổ sung\n•BH bệnh hiểm nghèo từ giai đoạn đầu(*)\n•BH sức khỏe dành cho trẻ em \n•BH miễn đóng phí bệnh hiểm nghèo (**)\n•BH từ bỏ thu phí\n•BH từ bỏ thu phí người hôn phối\n•BH hỗ trợ tài chính người phụ thuộc\n•BH hỗ trợ tài chính người hôn phối\n•BH chăm sóc sức khỏe toàn diện"],["3. Hoán đổi quỹ\nBán bớt một phần/ toàn bộ tài sản hiện có trong Quỹ này để đầu tư vào Quỹ khác"],["Anytime - có thể hoán đổi 1 phần hoặc 100% GTQ\nKhông được hoán đổi giữa các quỹ giữa GTTK cơ bản và GTTK đầu tư thêm"],["► Click để xem chi tiết QL của các sản phẩm bổ trợ nhóm 1","Đối tượng yêu cầu là BMBH hoặc NĐBH (trong trường hợp BMBH là tổ chức)"],["4. Rút 1 phần GTQ của HĐ"],["(*) Không được tham gia sản phẩm BH bệnh lý nghiêm trọng (Nhóm 1) và sản phẩm BH bệnh hiểm nghèo từ giai đoạn đầu (Nhóm 2) trên cùng một NĐBH trong cùng 1 HĐBH. \n(**) Không được tham gia sản phẩm BH từ bỏ thu phí bệnh lý nghiêm trọng (Nhóm 1) và sản phẩm BH miễn đóng phí bệnh hiểm nghèo (Nhóm 2) trên cùng một NĐBH trong cùng 1 HĐBH.","Anytime, từ ngày 5/9/2019 quy định để lại tối thiểu 1 triệu trên GTTK cơ bản khi rút từ GTTK cơ bản\nƯu tiên rút tiền từ GTTK đầu tư thêm trước sau đó mới đến GTTK cơ bản"],["KH có thể chọn số tiền rút hoặc tỷ lệ rút (%) từ một hoặc nhiều Quỹ mà KH sở hữu"],["Trường hợp BMBH là tổ chức , khoản rút tiền từ GTQ do BMBH y/c được chi trả cho NĐBH"],["II. CÁC LOẠI PHÍ","5. Thay đổi STBH của SPC và/hoặc SPBT nhóm 1"],["1. PHÍ BAN ĐẦU:","Từ năm thứ 3 - thực hiện 1 lần/ năm\nTăng STBH chỉ thực hiện khi LA ≤ 65 tuổi"],["Là khoản phí được cty sử dụng cho các CF khai thác ban đầu và khấu trừ trước khi phí BH và phí BH đóng thêm được phân bổ vào các quỹ liên kết đơn vị"],["STBH mới phải thoả quy định về STBH tổi thiểu tại từng thời điểm\nTrong thời gian tạm ngưng đóng phí BH, KHÔNG được thay đổi STBH"],["Năm HĐ","Năm 1","Năm 2","Năm 3","Năm 4","Năm 5+"],["Phí bảo hiểm cơ bản","0.85","0.75","0.1","0.05","0","Không làm thay đổi phí BH mà chỉ thay đổi COI"],["Phí BH đóng thêm","0.05","Có hiệu lực từ ngày kỷ niệm năm HĐ ngay sau khi y/c được cty chấp thuận"],["2. PHÍ BẢO HIỂM RỦI RO: COI","6. Thay đổi phí BH cơ bản"],["Là khoản phí được khấu trừ hàng tháng trong GTQ (trừ từ GTTK cơ bản trước sau đó mới đến GTTK đầu tư thêm) vào ngày định giá ngay sau ngày kỷ niệm tháng của HĐ để đảm bảo chi trả QLBH rủi ro cho SPC  và các BH bổ trợ nhóm 1 theo cam kết trong HĐBH","Có hiệu lực từ ngày kỷ niệm năm HĐ sau khi y/c được cty chấp thuận\nThay đổi phí max 1 lần/ năm"],["* Tăng phí BH cơ bản: thực hiện sau thời gian cân nhắc - max 1 lần/ năm\n    - 4 năm HĐ đầu: Tăng phí khi bổ sung sản phẩm GTBV nhóm 1 và phí BH cơ bản hiện tại thấp hơn mức phí BH cơ bản tối thiểu theo quy định\n    - Từ năm HĐ thứ 5: tăng phí bất cứ lúc nào. Phí BH cơ bản mới sau khi tăng ≤ 2 lần phí BH cơ bản năm đầu tiên\n==>Trong mọi trường hợp, STBH ≥ 5 lần phí BH cơ bản sau khi tăng"],["COI phụ thuộc vào: STBH của SPC và các bảo hiểm bổ trợ nhóm 1 (nếu có) + Tuổi bảo hiểm của LA + Giới tính + Thời hạn bảo hiểm + Sức khoẻ, nghề nghiệp"],["3. PHÍ QUẢN LÝ HỢP ĐỒNG: Admin charge","* Giảm phí BH cơ bản: Từ năm thứ 6 với điều kiện phí BH cơ bản của 5 năm HĐ đầu tiên đã được đóng đầy đủ và không thấp hơn mức phí tối thiểu theo quy định"],["Hiện tại Adm charge đang là 40K/ tháng và được khấu trừ hàng tháng từ giá trị quỹ (trừ từ GTTK cơ bản trước sau đó mới đến GTTK đầu tư thêm) vào ngày định giá ngay sau ngày kỷ niệm tháng của HĐ","7. Tạm ngưng đóng phí BH"],["4. PHÍ QUẢN LÝ QUỸ:","Từ năm thứ 6 với đkiện HĐ đang IF và GTQ của HĐ tại thời điểm tạm ngưng còn đủ để trả cho COI + Adm charge"],["Là khoản tiền được dùng để chi trả cho các HĐ quản lý quỹ liên kết đơn vị và được khấu trừ khi tính giá trị tài sản thuần vào mỗi ngày định giá","Chỉ áp dụng cho SPC và các BH bổ trợ nhóm 1 . BMBH có quyền y/c chỉ đóng phí BH cho các BH bổ trợ nhóm 2 (nếu có) trong thời gian tạm ngưng đóng phí"],["Trong trường hợp Phí quản lý quỹ giảm, Quyền lợi Thưởng duy trì Hợp đồng có thể được điều chỉnh giảm theo thông báo bằng văn bản của Prudential trước 3 tháng kể từ ngày áp dụng giảm Quyền lợi Thưởng duy trì Hợp đồng","Để gỡ tình trạng Premium holiday trên hệ thống cần đóng lại tất cả các kỳ phí BH cơ bản chưa đóng đến hiện tại"],["Việc tạm ngưng đóng phí BH có thể ảnh hưởng đến QLBH và HĐBH có thể lapsed nếu GTQ không đủ để khấu trừ COI+Adm charge"],["Quỹ Prulink Cổ phiếu VN","2,5%/ năm","Quỹ Prulink Bền Vững","1,5%/ năm","Trong thời giam tạm ngưng: KHÔNG được thay đổi STBH/ bổ sung rider/ topup"],["Quỹ Prulink Tăng trưởng","2%/ năm","Quỹ Prulink Trái Phiếu VN","1%/ năm","8. Chấm dứt HĐ trước thời hạn"],["Quỹ Prulink Cân Bằng","1,75%/ năm","Quỹ Prulink Bảo Toàn","1%/ năm","Anytime và không bị trừ phí chấm dứt HĐ trước thời hạn"],["DỊCH VỤ TƯ VẤN SỨC KHỎE MIỄN PHÍ 24/7 TOÀN CẦU - stop 4/12/2019","Trường hợp BMBH là tổ chức có y/c chấm dứt HĐ, GTHL nếu có sẽ được chi trả cho NĐBH"],["Điều kiện: Hợp đồng Pru - Đầu Tư Linh Hoạt tham gia từ 1/9/2018 đã qua 21 ngày cân nhắc, không phân biệt mức phí, thời hạn, định kỳ đóng phí","International SOS là tập đoàn đa quốc gia chuyên cung cấp cho KH các giải pháp về chăm sóc, tư vấn sức khỏe, dịch vụ y tế, dịch vụ an ninh, vận chuyển cấp cứu quốc tế và giải cứu khẩn cấp toàn cầu. Cho đến nay, International SOS đang phục vụ khách hàng thông qua mạng lưới hoạt động trên 1.000 địa điểm tại 90 quốc gia với 11.000 chuyên viên, nhân viên, 1.400 bác sĩ, 200 chuyên gia an ninh. \nĐể biết thêm thông tin chi tiết, vui lòng truy cập http://www.internationalsos.com.","9. Khôi phục hiệu lực HĐBH"],["Giới thiệu: Dịch vụ Tư vấn Sức khỏe 24/7 Toàn       + \"Quý khách đã từng đi khám, được chẩn đoán, điều trị hoặc đang theo dõi bệnh ung thư, ung thư tại chỗ, khối u, bướu, nan, nốt, tăng sinh các loại, bệnh gan bao gồm cả viêm gan, bệnh tim, bệnh thận, bệnh về máu hoặc đái tháo đường trước đây không?\"\n        + \"Bạn có đang tham gia sản phẩm PRU-IProtect với Prudential hay không?\"","· Trả lời 2 câu hỏi thẩm định\n        + \"Bạn đã từng được khám, điều trị, hoặc đang theo dõi bệnh tim mạch, bệnh thận, bệnh gan, đái tháo đường, bệnh về máu hay khối u bướu, ung thư nào trước đây không?\"\n        + \"Bạn có đang tham gia sản phẩm này với Prudential hay không?\""],["Thẩm định tự động","· Hệ thống sẽ tự động kiểm tra thẩm định\n- Số điện thoại này đã được nhận SMS quảng cáo trong vòng 90 ngày hoặc được telesales gọi điện tư vấn trong vòng 30 ngày tuỳ ngày nào kết thúc trước (chỉ áp dụng đối với trường hợp bán qua Viettel)\n- Số điện thoại này có từng được đăng ký sản phẩm này chưa? \n- Số CMND/ hộ chiếu này có từng được đăng ký sản phẩm này chưa?\n- Trả lời KHÔNG cho 2 câu hỏi thẩm định trong mục đăng ký\n- Khách hàng với số CMND này có từng bị từ chối hoặc chấp nhận bảo hiểm có điều kiện cho các sản phẩm truyền thống trước đây không?\n=>> Trong trường hợp khách hàng không thỏa 1 trong những điều kiện trên, hiển thị thông báo: “Cảm ơn bạn đã sử dụng dịch vụ của trang web e.prudential.com.vn. Với các thông tin bạn đã cung cấp, bạn chưa thỏa điều kiện để mua sản phẩm bảo hiểm trực tuyến trên website e.prudential.com.vn\nPrudential sẽ liên hệ với bạn để tư vấn giải pháp bảo hiểm nhân thọ phù hợp với nhau cầu của bạn sau.\". Hệ thống sẽ ghi nhận các trường hợp này và chuyển tới telesales để gọi điện lại tư vấn."],["Xác nhận thông tin","- Nếu KH thoả điều kiện, màn hình hiển thị bảng minh họa sản phẩm, bao gồm các thông tin KH đã đăng ký, mức phí, và các quyền lợi của sản phẩm. Đồng thời đính kèm file Điều kiện & Điều khoản của sản phẩm (file PDF).\n- KH nhấn nút \"Thanh toán\" và tiến hành thanh toán trực","- Nếu KH thoả điều kiện, màn hình hiển thị bảng minh họa sản phẩm, bao gồm các thông tin KH đã đăng ký, mức phí và phương thức thanh toán, và các quyền lợi của sản phẩm. Đồng thời đính kèm file để KH có thể download Điều kiện & Điều khoản của sản phẩm (file PDF) này và Bảng Minh Họa Sản Phẩm.\n- KH nhấn nút \"Xác nhận đăng ký\" để nhận mã xác nhận OTP qua số điện thoại đã đăng ký. OTP chỉ có hiệu thực trong vòng 5 phút. Quá 5 phút, KH sẽ phải yêu cầu tạo mã mới"],["Thanh toán phí bảo hiểm đầu tiên","- Sau khi KH nhấn nút \"Thanh toán\" hệ thống sẽ tự động chuyển đến trang thanh toán trực tuyến của Pruonline để KH nhập thông tin TK ngân hàng (thẻ quốc tế/ nội địa)","Nếu OTP khớp:\n· Đối với KH đã lựa chọn BankPlus và Viettel Pay, KH thực hiện theo link hướng dẫn để thanh toán trong vòng tối đa 7 ngày \n· Đối với KH đã lựa chọn thanh toán tự động, hệ thống tự động trừ tiền trong tài khoản thuê bao di động trả trước hoặc ghi nhận trong cước thuê bao di động trả sau, đồng thời KH sẽ nhận được SMS xác nhận. Nếu trừ tiền không thành công đối với thuê bao trả trước, trong vòng 7 ngày ngay khi KH nạp tiền, hệ thống sẽ trừ tự động."],["Bộ hợp đồng bảo hiểm","Ngay khi HĐ được chấp thuận và nhận được phí, bộ HĐ điện tử e-policy sẽ được gửi qua email cho KH hoặc KH có thể truy cập Pruonline để xem bộ HĐ (giấy chứng nhận bảo hiểm, Pruquote, Điều kiện và điều khoản, hoá đơn điện tử)"],["Quy trình nhắc phí","SMS nhắc phí như SP thông thường khác","Áp dụng với hình thức đóng phí tháng: 1 ngày trước ngày đến hạn đóng phí, KH sẽ nhận được SMS nhắc phí\nĐối với hình thức thanh toán tự động, hệ thống sẽ quét và trừ tiền tự động hàng ngày đến khi nhận được phí. \nTất cả các hình thức đóng phí đều được gia hạn tối đa 60 ngày. Quá 60 ngày HĐ sẽ bị huỷ và không khôi phục được"],["Quy trình tái tục","HĐ tự động tái tục khi KH đóng phí đầy đủ, đúng hạn","1  ngày trước ngày đáo hạn hàng năm, KH sẽ nhận được SMS thông báo về việc HĐ tự động tái tục, nếu KH không đồng ý thì soạn tin nhắn từ chối tái tục"],["Các nghiệp vụ phát sinh","· Đổi định  kỳ: chờ đáo niên gửi yêu cầu cho Prudential\n· HĐ sẽ tự động chấm dứt khi:\n    - Quá 60 ngày gia hạn không đóng phí\n    - Hết thời hạn bảo hiểm 10 năm hoặc LA 50 tuổi tuỳ ngày nào đến trước","· Đổi định  kỳ: chờ đáo niên gửi yêu cầu cho Prudential\n· Tạm ngưng hợp đồng: KH có thể lên Pruonline đăng ký hoặc liên hệ tổng đài mạng di động của KH -> việc tạm ngưng chỉ làm ngưng việc tự động trừ tiền điện thoại, HĐ vẫn có hiệu lực bảo hiểm đến khi hết 60 ngày gia hạn đóng phí \n· HĐ đã đăng ký tạm ngưng nhưng vẫn trong 60 ngày gia hạn đóng phí vẫn có thể đăng ký lại bằng cách lên Pruonline thực hiện. Quá thời gian 60 ngày gia hạn đóng phí, HĐ sẽ bị huỷ\n· HĐ sẽ tự động chấm dứt khi:\n    - Quá 60 ngày gia hạn không đóng phí\n    - Hết thời hạn bảo hiểm 10 năm hoặc LA 50 tuổi tuỳ ngày nào đến trước\n    - KH đăng ký chuyển đổi chủ thuê bao với nhà mạng\n    - KH chuyển đổi gói cước từ trả trước sang trả sau và ngược lại\n    - KH cắt hủy dịch vụ di động"]],"addon_rows":[]},{"id":"main-43","name":"KHỞI ĐẦU LINH HOẠT","code":"EAP6","english":null,"type":"Bảo hiểm & tiết kiệm","launch_from":"18/10/2018","launch_to":null,"stop":"N","paid_up":"Yes","detail_rows":[["Tuổi tham gia","Tuổi tối đa kết thúc THHĐ","THĐP & THHĐ","STBH min"],["30 ngày - 60 tuổi","80 tuổi","THĐP = 10 năm --->> THHĐ = 15 năm","40 triệu"],["THĐP = 15 năm --->> THHĐ = 15 hoặc 20 năm"],["I. QUYỀN LỢI TV/ TPD/ Bệnh hiểm nghèo giai đoạn cuối","QLBH đối với LA < 4 tuổi"],["Giá trị nào cao hơn giữa:\n· 100% STBH + BTTL\n· Tổng phí BH đã đóng (không lãi) - BTTL đã rút trước (nếu có)","< 1 tuổi","Hoàn lại phí đã đóng không lãi"],["Từ 1 đến < 2 tuổi","Max [25% (STBH + BTTL); Tổng phí đã đóng] + TV do tai nạn: 25% STBH"],["II. QUYỀN LỢI TV DO TAI NẠN (< 65 TUỔI)","Từ 2 đến < 3 tuổi","Max[50% (STBH + BTTL); Tổng phí đã đóng] + TV do tai nạn: 50% STBH"],["QLTV + 100% STBH\n* NĐBH tử vong trong vòng 180 ngày kể từ ngày xảy ra tai nạn","Từ 3 đến < 4 tuổi","Max [75% (STBH + e","launch_from":"27/02/2020","launch_to":null,"stop":"N","detail_rows":[["Độ tuổi tham gia tối đa","Tuổi kết thúc tối đa","THHĐ = THĐP","Nhóm nghề","Đính kèm trong HĐBH mới có SPC sau","- Pru Đầu Tư Linh Hoạt\n- Phú Bảo An\n- Pru Chủ Động Cuộc Sống\n- Pru Bảo Vệ Tối Ưu","- LA KHÔNG được tham gia SPBT này nếu đã tham gia HRI1 hoặc tổng các SP về SK khác (H&S) > 400K trên tất cả các HĐBH\n- Nếu LA đã có tham gia H&S với tổng STBH  ≤ 400K & trong quy tắc, điều khoản của H&S có bao gồm điều khoản PVA có quyền từ chối duy trì hiệu lực của SPBT thì LA đó có  thể tham gia thêm SPBT này\n- 1 LA chỉ được tham gia tối đa 1 SPBT Pru Hành Trang Vui Khỏe"],["30 ngày - 65 tuổi","70 tuổi","1 năm","1,2,3,4"],["Tuổi tham gia tính theo tuổi thực tế của NĐBH; Thời điểm kết thúc tối đa SPBT này là vào ngày đáo niên ngay sau ngày NĐBH đạt 70 tuổi\nTrong HĐ liên kết đầu tư, SPBT này sẽ không được linh hoạt đóng phí"],["LA ≤ 10 tuổi","Cha/mẹ là PO và có tham gia SPBT này trên cùng 1 HĐBH & chương trình BH của con không cao hơn chương trình BH của cha/mẹ","Bảng tính phí BH"],["11 tuổi ≤ LA < 18 tuổi","Cha/mẹ phải là PO của HĐ"],["NĐBH chính","Có thể tham gia bất kỳ chtr BH nào (trừ trường hợp LA < 18 tuổi)"],["NĐBH bổ sung","- Tham gia được QL điều trị nội trú (dù LA chính có tham gia hay không, trừ trường hợp LA bổ sung < 18 tuổi)\n- Chỉ có thể tham gia QL bổ sung tùy chọn nếu LA chính có tham gia QL bổ sung tùy chọn & chương trình BH của LA bổ sung không cao hơn chương trình BH của LA chính (trừ trường hợp LA < 18 tuổi)","Phí BH có thể thay đổi theo tuổi thực tế tại thời điểm đáo niên HĐ"],["Chương trình BH","Chăm sóc nâng cao","Chăm sóc toàn diện","Chăm sóc hoàn hảo\n(API của SPC ≥ 15 triệu/năm)"],["Phạm vi bảo hiểm","Việt Nam","Việt Nam","Đông Nam Á \n(10 nước)","- Thay đổi chương trình BH/ QL bảo hiểm chỉ thực hiện vào đáo niên HĐ"],["QL điều trị nội trú (click here)","200 triệu","400 triệu","1 tỷ","- QL bổ sung tùy chọn: KH có thể đký hoặc không đký tham gia"],["QL bổ sung","QL điều trị ngoại trú (click here)","x","12 triệu","40 triệu","- QL điều trị ngoại trú + nha khoa + thai sản sẽ gắn liền với nhau khi KH đký QL bổ sung trong các chtr tương ứng"],["QL chăm sóc nha khoa (click here)","x","5 triệu","20 triệu","- QL điều trị ngoại trú và QL chăm sóc nha khoa sẽ áp dụng đồng chi trả 20% nếu KH khám/ điều trị tại bệnh viên tư hoặc phòng khám tư"],["QL chăm sóc thai sản (click here)","x","x","60 triệu *","* QL chăm sóc thai sản chỉ áp dụng cho LA nữ từ 18 - 49 tuổi và tuổi tại thời điểm đký tham gia chtr Chăm sóc Hoàn hảo ≤ 45 tuổi"],["PO có thể gửi văn bản yêu cầu thay đổi chtr BH và/hoặc QLBH ít nhất 30 ngày trước ngày đáo niên\nPO phải thông báo bằng văn bản cho Prudential trong vòng ít nhất 30 ngày kể từ ngày PO/LA thay đổi nơi cư trú/ nghề nghiệp\nPrudential có quyền từ chối gia hạn SPBT này và thông báo bằng văn bản cho BMBH ít nhất 30 ngày trước ngày đáo niên (điều 2 điều khoản SPBT)"],["THỜI GIAN CHỜ"],["Trong trường hợp việc chi trả QLBH có liên quan đến nhiều hơn 1 thời gian chờ, thời gian chờ dài nhất sẽ được áp dụng"],["- QL nội trú/ ngoại trú: 30 ngày, ngoại trừ do tai nạn gây ra\n- Bệnh đặc biệt/ Điều trị ung thư/ Cấy ghép nội tạng: 90 ngày\n- Biến chứng thai sản & Chăm sóc thai sản: 270 ngày\n- QL nha khoa - giai đoạn 1 (CF y tế dự phòng): 30 ngày\n- QL nha khoa - giai đoạn 2 (điều trị bảo tồn): 180 ngày\n- QL nha khoa - giai đoạn 3 (điều trị phục hình răng): 365 ngày","Danh sách bệnh đặc biệt"],["THỦ TỤC GIẢI QUYẾT QLBH"],["1. Bảo lãnh viện phí: HĐ đang IF, đã qua 21 ngày cân nhắc và đã đóng đủ kỳ phí hiện tại"],["KH điều trị trong hệ thống bệnh viện/ phòng khám thanh toán trực tiếp liên kết với Prudential: danh sách được cập nhật trên website https://www.prudential.com.vn (mục Chăm sóc khách hàng/ Giải quyết QLBH)"],["Dịch vụ bảo lãnh nội trú thực hiện trong giờ hành chính, bảo lãnh ngoại trú thực hiện 24/7"],["Dịch vụ bảo lãnh không áp dụng cho các trường hợp cần xác minh, thẩm định/tái thẩm định, cấp cứu, tai nạn. Trường hợp không đủ cơ sở được bảo lãnh, KH có thể thu thập hồ sơ gửi về Prudential để thẩm định"],["Khách hàng vui lòng đóng tiền tạm ứng theo quy định của cơ sở y tế"],["KH xuất trình thẻ Chăm sóc sức khỏe của Prudential (thẻ cứng hoặc thẻ điện tử trên Pruonline) kèm CMND/ căn cước công dân, Giấy khai sinh (LA < 14 tuổi), hoặc hộ chiếu đối với cơ sở y tế ở nước ngoài\nKhi xuất viện:  KH ktra số tiền được bảo lãnh và ký vào Thư chấp thuận, thanh toán chi phí chênh lệch (nếu có) cho BV/phòng khám"],["Để được hỗ trợ, KH liên hệ tổng đài miễn cước phía sau mặt thẻ 1800 6289 \n* Cty TNHH Insmart được chỉ định để giải quyết QLBH sức khỏe của Prudential VN. Insmart phụ trách giải đáp các thắc mắc của KH về SP Pru Hành Trang Vui Khỏe qua đường dây nóng 1800 6289 cùng email hỗ trợ chamsocsuckhoe@prudential.com.vn"],["2. Thanh toán trước, yêu cầu giải quyết QLBH sau:  nộp yêu cầu giải quyết QLBH trong vòng 90 ngày kể từ ngày xuất viện hoặc ngày bắt đầu điều trị ngoại trú/nha khoa. Nếu có lý do hợp lệ cho việc nộp trễ thì KH cần nộp hồ sơ trong vòng 12 tháng từ ngày xảy ra sự kiện BH"],["Nếu phát sinh sự kiện BH dẫn đến yêu cầu bồi thường trong thời gian gia hạn đóng phí, Prudential sẽ khấu trừ phí BH đến hạn chưa thanh toán (nếu có) trước khi chi trả QLBH trong thời gian gia hạn"],["Chứng từ thanh toán: Hóa đơn/ biên lai viện phí và Bảng kê chi phí khám chữa bệnh nội trú/ ngoại trú Prudential sẽ thu giữ bản gốc trừ trường hợp KH đã nộp bản gốc cho cty bảo hiểm khác và được chấp thuận chi trả 1 phần thì có thể nộp bản sao công chứng chứng từ thanh toán kèm với bản gốc Xác nhận từ cty BH khác về thông tin chi trả QLBH liên quan đến QL & STBH đã được chi trả 1 phần\n     Đối với CF tiền thuốc > 200K phải có hóa đơn tài chính, trường hợp không có hóa đơn tài chính mà chỉ có hóa đơn bán lẻ thì KH sẽ chỉ được thanh toán tối đa 200k/ toa thuốc (không chấp nhận việc tách hóa đơn bán lẻ cho từng loại thuốc)"],["Chứng từ y tế: nếu nộp tại VP cần mang theo bản gốc để đối chiếu; nếu nộp trực tuyến cần chụp trên bản gốc \n- Toa thuốc/ Sổ khám bệnh có chuẩn đoán và chỉ định điều trị\n- Các kết quả cận lâm sàng (xét nghiệm máu, siêu âm, X-quang và các xét nghiệm tương tự khác)\n- Toa thuốc/ chỉ định tái khám sau xuất viện\n- Báo cáo y khoa có thể hiện nguyên nhân bệnh lý (nếu có)/ Chứng nhận bệnh lý có chẩn đoán bệnh\n- Chỉ định thủ thuật/ phẫu thuật (nếu có)\n- Lịch trình điều trị (nếu có)\n- Đối với QL nội trú: Giấy ra viện; Tóm tắt bệnh án\n- Đối với QL nha khoa: Phiếu điều trị răng có số răng bệnh lý điều trị, phương pháp điều trị\n- Đối với phẫu thuật: Giấy chứng nhận phẫu thuật\n- Đối với tai nạn: Bản tường trình tai nạn có chứng thực của cơ quan có thẩm quyền liên quan\n   + Tai nạn sinh hoạt: Bản sao biên bản kết luận điều tra của công an/ Bản gốc tường trình có xác nhận của CQĐP\n   + Tai nạn lao động: Bản sao biên bản tai nạn lao động của công an/ bản gốc tường trình tai nạn có xác nhận của cơ quan/cty\n   + Tai nạn giao thông: Bản sao biên bản kết luận điều tra của công an/ bản gốc tường trình tai nạn. Giấy tờ đăng ký xe và giấy phép lái xe trường hợp NĐBH bị tai nạn trong khi điều khiển xe cơ giới > 50cc"],["Chứng từ khi KH điều trị ở nước ngoài:\n- Đối với chứng từ điều trị bằng tiếng Anh: không cần dịch sang tiếng Việt\n- Đối với chứng từ điều trị bằng ngôn ngữ khác: ngoài chứng từ của bệnh viện/ phòng khám thì KH cần nộp thêm bản gốc bản dịch ra tiếng Việt/ tiếng Anh có mộc của cty dịch thuật có đầy đủ pháp nhân"],["=> Prudential có trách nhiệm giải quyết QLBH trong vòng 30 ngày làm việc kể từ ngày nhận được hồ sơ đầy đủ & hợp lệ"],["— Quyền lợi Noi Tru —"],["Sau thời gian chờ 30 ngày (ngoại trừ do tai nạn), cty sẽ chi trả CF y tế phát sinh thực tế lên đến Giới hạn phụ của từng chương trình bảo hiểm theo bảng dưới đây. Trong mọi trường hợp, tổng số tiền chi trả cho QL điều trị nội trú sẽ không vượt quá STBH tối đa (ngoại trừ QL gia tăng)"],["CHƯƠNG TRÌNH CHĂM SÓC","NÂNG CAO","TOÀN DIỆN","HOÀN HẢO"],["Giới hạn bảo hiểm tối đa/ năm HĐ","200 triệu",     </script>

    <!-- Script khởi tạo icons hệ thống -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });
    </script>

    <!-- Script Thư viện Sản phẩm -->
    <script>
    (function () {
        const DATA = JSON.parse(document.getElementById('products-data').textContent);
        let currentTab = 'main';
        let currentList = DATA.main_products;

        const grid = document.getElementById('cardGrid');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const statusFilter = document.getElementById('statusFilter');
        const typeFilter = document.getElementById('typeFilter');

        document.getElementById('countMain').textContent = '(' + DATA.main_products.length + ')';
        document.getElementById('countAddon').textContent = '(' + DATA.addon_products.length + ')';

        function statusBadge(stop) {
            if (stop === 'N') return '<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/15 text-emerald-600 dark:text-emerald-400">Đang bán</span>';
            if (stop === 'Y') return '<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-slate-500/15 text-slate-500 dark:text-slate-400">Ngừng bán</span>';
            return '<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-amber-500/15 text-amber-600 dark:text-amber-400">Chưa rõ</span>';
        }

        function typeBadge(type) {
            if (!type) return '';
            return '<span class="px-2 py-0.5 rounded-full text-[11px] font-medium bg-red-500/10 text-red-600 dark:text-red-400">' + escapeHtml(type) + '</span>';
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        function launchLabel(p) {
            const from = p.launch_from || '?';
            const to = p.launch_to ? p.launch_to : (p.stop === 'N' ? 'nay' : '?');
            return from + ' → ' + to;
        }

        function populateTypeFilter(list) {
            const types = Array.from(new Set(list.map(p => p.type).filter(Boolean))).sort();
            typeFilter.innerHTML = '<option value="">Tất cả loại hình</option>' +
                types.map(t => '<option value="' + escapeHtml(t) + '">' + escapeHtml(t) + '</option>').join('');
        }

        function cardHtml(p) {
            const codeStr = p.code ? ' (' + escapeHtml(p.code) + ')' : '';
            return `
            <button data-id="${p.id}" class="product-card text-left theme-card border rounded-xl p-3.5 flex flex-col gap-2">
                <div class="flex items-start justify-between gap-2">
                    <h3 class="font-bold text-sm leading-snug clamp-2">${escapeHtml(p.name)}<span class="font-normal opacity-60">${codeStr}</span></h3>
                    <i data-lucide="chevron-right" class="w-4 h-4 opacity-40 shrink-0 mt-0.5"></i>
                </div>
                ${p.english ? '<p class="text-xs opacity-60 -mt-1.5 line-clamp-1">' + escapeHtml(p.english) + '</p>' : ''}
                <div class="flex flex-wrap gap-1.5 mt-auto pt-1">
                    ${typeBadge(p.type)}
                    ${statusBadge(p.stop)}
                </div>
                <div class="flex items-center gap-1.5 text-[11px] opacity-60">
                    <i data-lucide="calendar" class="w-3 h-3"></i>
                    <span>Ra mắt: ${escapeHtml(launchLabel(p))}</span>
                </div>
            </button>`;
        }

        function render() {
            const q = searchInput.value.trim().toLowerCase();
            const st = statusFilter.value;
            const ty = typeFilter.value;

            const filtered = currentList.filter(p => {
                if (st && p.stop !== st) return false;
                if (ty && p.type !== ty) return false;
                if (q) {
                    const hay = (p.name + ' ' + (p.code || '') + ' ' + (p.english || '')).toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            });

            grid.innerHTML = filtered.map(cardHtml).join('');
            emptyState.classList.toggle('hidden', filtered.length !== 0);
            if (typeof lucide !== 'undefined') lucide.createIcons();

            grid.querySelectorAll('.product-card').forEach(btn => {
                btn.addEventListener('click', () => openDetail(btn.getAttribute('data-id')));
            });
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTab = btn.getAttribute('data-tab');
                currentList = currentTab === 'main' ? DATA.main_products : DATA.addon_products;
                searchInput.value = '';
                statusFilter.value = '';
                populateTypeFilter(currentList);
                render();
            });
        });

        searchInput.addEventListener('input', render);
        statusFilter.addEventListener('change', render);
        typeFilter.addEventListener('change', render);

        // ----- Modal chi tiết -----
        const modal = document.getElementById('detailModal');
        const detailTitle = document.getElementById('detailTitle');
        const detailSub = document.getElementById('detailSub');
        const detailBadges = document.getElementById('detailBadges');
        const detailBody = document.getElementById('detailBody');

        function isHeaderRow(row) {
            if (row.length !== 1) return false;
            const t = row[0];
            if (t.length > 90) return false;
            if (/^(QUYỀN LỢI|CÁC |DANH MỤC|CƠ CHẾ|QUY TRÌNH|I{1,3}\.|IV\.|V\.|—)/i.test(t)) return true;
            const letters = t.replace(/[^A-ZÀ-Ỹ a-zà-ỹ]/g, '');
            const upperRatio = letters.replace(/[^A-ZÀ-Ỹ]/g, '').length / Math.max(letters.replace(/\s/g,'').length, 1);
            return upperRatio > 0.7 && t.length < 70;
        }

        function nl2br(s) { return escapeHtml(s).replace(/\n/g, '<br>'); }

        function renderRows(rows) {
            if (!rows || rows.length === 0) {
                return '<p class="opacity-50 italic text-xs">Chưa có dữ liệu quyền lợi chi tiết cho mục này trong file.</p>';
            }
            let html = '';
            rows.forEach(row => {
                if (isHeaderRow(row)) {
                    html += `<h4 class="font-bold text-red-600 dark:text-red-400 text-[13px] mt-3 mb-1 first:mt-0">${nl2br(row[0])}</h4>`;
                } else if (row.length === 1) {
                    html += `<p class="text-[13px] leading-relaxed opacity-90">${nl2br(row[0])}</p>`;
                } else {
                    html += `<div class="grid gap-x-4 gap-y-1 py-2.5 border-b border-dashed border-slate-200 dark:border-slate-700 text-[13px]" style="grid-template-columns: repeat(${row.length}, minmax(150px, 1fr));">`;
                    row.forEach((cell, idx) => {
                        html += `<div class="${idx === 0 ? 'row-label font-semibold opacity-80' : 'opacity-90'}">${nl2br(cell)}</div>`;
                    });
                    html += `</div>`;
                }
            });
            return html;
        }

        function openDetail(id) {
            const p = DATA.main_products.concat(DATA.addon_products).find(x => x.id === id);
            if (!p) return;
            detailTitle.textContent = p.name + (p.code ? ' (' + p.code + ')' : '');
            detailSub.textContent = (p.english ? p.english + ' · ' : '') + 'Ra mắt: ' + launchLabel(p);
            detailBadges.innerHTML = typeBadge(p.type) + ' ' + statusBadge(p.stop) + (p.paid_up === 'Yes' ? ' <span class="px-2 py-0.5 rounded-full text-[11px] font-medium bg-blue-500/10 text-blue-600 dark:text-blue-400">Có Paid-up</span>' : '');

            let bodyHtml = renderRows(p.detail_rows);
            if (p.addon_rows && p.addon_rows.length) {
                bodyHtml += `<h4 class="font-bold text-red-600 dark:text-red-400 text-[13px] mt-4 mb-1">SẢN PHẨM BỔ TRỢ CÓ THỂ MUA KÈM</h4>` + renderRows(p.addon_rows);
            }
            detailBody.innerHTML = bodyHtml;

            modal.classList.remove('hidden');
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        document.getElementById('closeDetail').addEventListener('click', () => modal.classList.add('hidden'));
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.add('hidden'); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') modal.classList.add('hidden'); });

        // Khởi tạo
        populateTypeFilter(currentList);
        render();
    })();
    </script>
</body>
</html>
